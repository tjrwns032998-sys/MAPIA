<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>월광 살롱</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mafia" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 42c0 5 10 9 22 9s22-4 22-9c0-3-4-5-8-6.5C44 26 40 12 32 12S20 26 18 35.5C14 37 10 39 10 42z"/><path d="M18.5 35.5c8 3 19 3 27 0"/><path d="M25 14.5c3 5 11 5 14 0"/></g></symbol>
<symbol id="i-doctor" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 10h12v16h16v12H38v16H26V38H10V26h16z"/></g></symbol>
<symbol id="i-police" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 7l20 8v16c0 13-9 22-20 26C21 53 12 44 12 31V15z"/><path d="M32 20l3.4 7 7.6 1-5.5 5.2 1.4 7.6L32 37l-6.9 3.8 1.4-7.6L21 28l7.6-1z"/></g></symbol>
<symbol id="i-citizen" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="22" r="9"/><path d="M13 55c0-12 8-19 19-19s19 7 19 19"/></g></symbol>
<symbol id="i-moon" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M42 10a24 24 0 1 0 12 34 20 20 0 0 1-12-34z"/></g></symbol>
<symbol id="i-sun" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="32" cy="32" r="10"/><path d="M32 8v8M32 48v8M8 32h8M48 32h8M15 15l5.5 5.5M43.5 43.5L49 49M15 49l5.5-5.5M43.5 20.5L49 15"/></g></symbol>
<symbol id="i-ballot" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="10" y="30" width="44" height="24" rx="3"/><path d="M20 30V10h24v20"/><path d="M26 18h12M26 24h12"/></g></symbol>
<symbol id="i-speech" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14h44v28H30L18 54V42h-8z"/><path d="M20 24h24M20 32h14"/></g></symbol>
<symbol id="i-candle" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="23" y="30" width="18" height="26" rx="2"/><path d="M32 8c6 7 6 12 0 16-6-4-6-9 0-16z"/><path d="M32 30v-6"/></g></symbol>
<symbol id="i-cup" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h24v14a12 12 0 0 1-24 0z"/><path d="M20 14h-8c0 10 4 14 10 14M44 14h8c0 10-4 14-10 14"/><path d="M32 36v10M22 54h20M26 46h12"/></g></symbol>
<symbol id="i-tomb" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 56V28a16 16 0 0 1 32 0v28z"/><path d="M32 22v18M25 29h14"/></g></symbol>
<symbol id="i-skull" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M32 8C20 8 12 16 12 27c0 7 4 11 8 13v8h24v-8c4-2 8-6 8-13C52 16 44 8 32 8z"/><circle cx="24" cy="28" r="4"/><circle cx="40" cy="28" r="4"/><path d="M28 48v-6M36 48v-6M32 34l-2 4h4z"/></g></symbol>
<symbol id="i-gavel" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M34 10l14 14-8 8-14-14z"/><path d="M28 30L10 48l6 6 18-18"/><path d="M12 56h22"/></g></symbol>
<symbol id="i-vol" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26h10l14-10v32L20 38H10z"/><path d="M42 24c4 5 4 11 0 16M48 18c8 8 8 20 0 28"/></g></symbol>
<symbol id="i-mute" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M10 26h10l14-10v32L20 38H10z"/><path d="M44 26l12 12M56 26L44 38"/></g></symbol>
<symbol id="i-book" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12h30a6 6 0 0 1 6 6v36H20a6 6 0 0 1-6-6z"/><path d="M20 54V12M28 22h14M28 30h14"/></g></symbol>
<symbol id="i-door" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8h28v48H16z"/><path d="M40 32v.5M50 24l8 8-8 8M58 32H44"/></g></symbol>
<symbol id="i-link" viewBox="0 0 64 64"><g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M26 38a10 10 0 0 0 14 0l8-8a10 10 0 0 0-14-14l-3 3"/><path d="M38 26a10 10 0 0 0-14 0l-8 8a10 10 0 0 0 14 14l3-3"/></g></symbol>
</defs></svg>

<header class="top">
<div class="brand"><svg class="ic"><use href="#i-mafia"/></svg><div><h1>월광 살롱</h1><p>MAFIA · 마피아 게임방</p></div></div>
<div class="tools">
<label id="nickbox" for="nick" hidden><input id="nick" maxlength="10" placeholder="닉네임" autocomplete="off" aria-label="닉네임"></label>
<button id="btnCode" hidden title="초대 링크 복사"><svg class="ic"><use href="#i-link"/></svg><b class="chip-code" id="codeTxt"></b></button>
<button id="btnSnd" title="배경음악"><svg class="ic" id="sndIc"><use href="#i-vol"/></svg><span>음악</span></button>
<button id="btnGuide" title="직업 도감"><svg class="ic"><use href="#i-book"/></svg><span>도감</span></button>
<button id="btnLeave" hidden title="방 나가기"><svg class="ic"><use href="#i-door"/></svg><span>나가기</span></button>
</div>
</header>

<div class="shell">
<div id="notice" class="notice" hidden></div>

<section id="home" hidden>
<div class="pn door">
<svg class="ic big"><use href="#i-candle"/></svg>
<h2>월광 살롱에 어서 오세요</h2>
<p class="sub" style="margin:0">방을 만들어 코드를 친구에게 알려 주거나, 받은 코드로 입장하세요. 방은 몇 개든 동시에 열려요.</p>
<div class="two">
<div class="box"><h3>새 방 만들기</h3><p class="sub" style="margin:0">코드가 자동으로 만들어져요. 최대 20명까지 함께할 수 있어요.</p><button class="main" id="btnCreate">방 만들기</button></div>
<form class="box" id="joinForm" style="flex-direction:column"><h3>코드로 입장</h3><input id="codeIn" maxlength="6" placeholder="CODE" autocomplete="off" aria-label="방 코드"><button class="main" id="btnJoin">입장하기</button></form>
</div>
<p class="err" id="roomErr" role="alert"></p>
</div>
</section>

<section id="room" hidden>
<div class="colL">
<section class="pn stage" id="stage"></section>
<section class="pn seatpn"><div id="seats" class="seats" aria-label="좌석"></div></section>
<section class="pn" id="chatpn"><h2><span id="chatTitle">대화</span><small id="chatHint"></small></h2><div id="chatlog" class="chatlog"></div>
<form id="chatform"><input id="chatin" maxlength="200" autocomplete="off" aria-label="채팅 입력"><button id="chatgo" class="main">보내기</button></form></section>
</div>
<div class="colR">
<section class="pn" id="me"></section>
<section class="pn" id="side2"></section>
</div>
</section>
</div>

<div id="fx" aria-hidden="true"><div class="veil"></div><canvas id="fxc"></canvas><div class="fxcard" id="fxcard"></div></div>

<dialog id="dlg"><div class="dlghead"><h2 style="margin:0">직업 도감</h2><button id="dlgClose">닫기</button></div><div id="info"></div><h2 style="margin-top:14px">진행 기록</h2><ol id="log" class="log"></ol></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="bots.js"></script>
<script src="audio.js"></script>
<script src="net.js"></script>
<script src="fx.js"></script>
<script src="ui.js"></script>
</body>
</html>
